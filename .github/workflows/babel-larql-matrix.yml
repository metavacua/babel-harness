# larql debugging MATRIX — build once, fan out a dozen hypotheses in PARALLEL on
# capable runners, STREAM every cell's output (set -x + unbuffered + tee, no
# silent file-redirect / no `| tail` buffering). One run answers many questions;
# live logs are visible in the Actions UI as each cell runs. This replaces the
# serial, blind, 20-min-per-guess loop.
#
# Root cause under test: larql run/serve/show prepend hf:// to a filesystem path
# (a local vindex 404s as hf://<abspath>) — local vindexes must be `larql link`ed
# and referenced by cache name. Cells test that + run-vs-serve + f16-vs-q4k +
# extract-vs-published, all at once, lightest models first.
name: babel-larql-matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/babel-larql-matrix.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build larql once (shared artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: metavacua/larql-to-sparql
      - run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config
      - name: build larql-cli + larql-server (timed)
        run: |
          set -x
          t0=$(date +%s)
          stdbuf -oL -eL cargo build --release -p larql-cli -p larql-server 2>&1 | stdbuf -oL tail -25
          t1=$(date +%s)
          echo "## build: $((t1-t0))s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: larql-bins
          path: |
            target/release/larql
            target/release/larql-server
          retention-days: 1

  test:
    name: "cell ${{ matrix.cell }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          - run-hf-gemma-f16       # does DIRECT run work on the f16 gemma vindex (serve 500'd)?
          - run-hf-granite-q4k     # direct run on published q4k vindex (serve hit Io NotFound)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: larql-bins
          path: bin
      - name: install runtime deps (OpenBLAS — the binary dynamically links it)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: run cell (streamed, unbuffered)
        run: |
          set -x
          chmod +x bin/larql bin/larql-server || true
          CELL="${{ matrix.cell }}" LARQL_BIN_DIR="$PWD/bin" bash scripts/larql_cell.sh

  diagnose:
    name: on-error diagnosis (babel-local qwen2.5:1.5b)
    needs: test
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read      # to fetch the failed job's logs
    steps:
      - uses: actions/checkout@v5
      - name: provision known-working babel-local model (Ollama qwen2.5:1.5b)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:11434/ >/dev/null 2>&1 && break; sleep 1; done
          ollama pull qwen2.5:1.5b
      - name: diagnose the failure
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FAILED_JOB: "babel-larql-matrix / test"
        run: bash scripts/ci_diagnose.sh
      - uses: actions/download-artifact@v4
        with:
          name: larql-bins
          path: bin
      - name: attempt fix in the ephemeral runner (record only)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sudo apt-get update && sudo apt-get install -y libopenblas-dev
          chmod +x bin/larql bin/larql-server || true
          FAIL_LOG="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --jq '.jobs[] | select(.conclusion=="failure") | .id' 2>/dev/null | while read -r jid; do
              gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${jid}/logs" 2>/dev/null | tail -60
            done | tail -120)"
          export FAIL_LOG
          export FAIL_CMD="CELL=run-hf-granite-q4k LARQL_BIN_DIR=$PWD/bin bash scripts/larql_cell.sh"
          export TARGET_FILE="scripts/larql_cell.sh"
          bash scripts/ci_fix.sh || true   # NOT-FIXED is a recorded outcome, not a job failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: babel-local-fix
          path: artifact/
          retention-days: 3
