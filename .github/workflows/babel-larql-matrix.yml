# larql debugging MATRIX — build once, fan out a dozen hypotheses in PARALLEL on
# capable runners, STREAM every cell's output (set -x + unbuffered + tee, no
# silent file-redirect / no `| tail` buffering). One run answers many questions;
# live logs are visible in the Actions UI as each cell runs. This replaces the
# serial, blind, 20-min-per-guess loop.
#
# Root cause under test: larql run/serve/show prepend hf:// to a filesystem path
# (a local vindex 404s as hf://<abspath>) — local vindexes must be `larql link`ed
# and referenced by cache name. Cells test that + run-vs-serve + f16-vs-q4k +
# extract-vs-published, all at once, lightest models first.
name: babel-larql-matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/babel-larql-matrix.yml"

permissions:
  contents: read

jobs:
  build:
    name: build larql once (shared artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: metavacua/larql-to-sparql
      - run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config
      - name: build larql-cli + larql-server (timed)
        run: |
          set -x
          t0=$(date +%s)
          stdbuf -oL -eL cargo build --release -p larql-cli -p larql-server 2>&1 | stdbuf -oL tail -25
          t1=$(date +%s)
          echo "## build: $((t1-t0))s" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: larql-bins
          path: |
            target/release/larql
            target/release/larql-server
          retention-days: 1

  test:
    name: "cell ${{ matrix.cell }}"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cell:
          - run-extract-abs        # control: run a local extracted vindex by abs path (expect hf:// 404)
          - run-extract-link       # fix: extract -> link -> run by cache name
          - run-hf-gemma-f16       # does DIRECT run work on the f16 gemma vindex (serve 500'd)?
          - run-hf-granite-q4k     # direct run on published q4k vindex (serve hit Io NotFound)
          - serve-hf-gemma-f16     # serve the f16 gemma + /v1, capture the REAL error body
          - shannon-135m           # larql's own known-good recipe: shannon verify SmolLM2-135M
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: larql-bins
          path: bin
      - name: install runtime deps (OpenBLAS — the binary dynamically links it)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev
      - name: run cell (streamed, unbuffered)
        run: |
          set -x
          chmod +x bin/larql bin/larql-server || true
          export PATH="$PWD/bin:$PATH"
          set +e   # exploratory: run the whole sequence, don't abort mid-cell
          SMOL="hf://HuggingFaceTB/SmolLM2-135M-Instruct"
          Q="Reply with exactly one word: OK"
          V="$GITHUB_WORKSPACE/v"
          case "${{ matrix.cell }}" in
            run-extract-abs)
              larql extract "$SMOL" --output "$V"; echo "--- run by abs path ---"
              larql run "$V" "$Q" -n 8 ;;
            run-extract-link)
              larql extract "$SMOL" --output "$V"; echo "--- link + list + run by name ---"
              larql link "$V"; larql list
              larql run SmolLM2-135M-Instruct "$Q" -n 8 ;;
            run-hf-gemma-f16)
              larql run hf://chrishayuk/gemma-3-4b-it-vindex "$Q" -n 8 ;;
            run-hf-granite-q4k)
              larql run hf://chrishayuk/granite-4.1-3b-q4k-vindex "$Q" -n 8 ;;
            serve-hf-gemma-f16)
              stdbuf -oL larql serve hf://chrishayuk/gemma-3-4b-it-vindex --port 8181 2>&1 | stdbuf -oL tee serve.log &
              for i in $(seq 1 120); do curl -fsS http://localhost:8181/v1/models >/dev/null 2>&1 && break; sleep 2; done
              curl -sS -w '\nHTTP %{http_code}\n' http://localhost:8181/v1/chat/completions \
                -H 'content-type: application/json' \
                -d '{"model":"m","messages":[{"role":"user","content":"'"$Q"'"}],"max_tokens":8}'
              echo "--- serve.log ---"; tail -40 serve.log ;;
            shannon-135m)
              larql shannon verify "$SMOL" 2>&1 | head -50 ;;
          esac
          echo "=== cell ${{ matrix.cell }} exit=$? ==="
