# Minimal larql-run baseline (systematic-debugging Phase 2/4: reproduce larql's
# OWN known-good recipe). Lightest model (SmolLM2-135M, ungated), extracted to a
# vindex, then DIRECT inference via `larql run` — no larql-server, no /v1, no
# goose, no port. This is the known-good FLOOR to build the babel-local serve
# path up from, one variable at a time — the opposite of the top-down
# serve-a-4B-model guessing that thrashed.
name: babel-larql-run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/babel-larql-run.yml"

permissions:
  contents: read

jobs:
  run-baseline:
    name: minimal larql run — SmolLM2-135M, direct inference (no server)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: checkout larql source (public, main)
        uses: actions/checkout@v5
        with:
          repository: metavacua/larql-to-sparql
          path: larql-src

      - name: install build deps (OpenBLAS)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config

      - name: build larql-cli (cold, TIMED)
        working-directory: larql-src
        run: |
          t0=$(date +%s)
          cargo build --release -p larql-cli 2>&1 | tail -15
          t1=$(date +%s)
          echo "## minimal larql run baseline (SmolLM2-135M, direct)" >> "$GITHUB_STEP_SUMMARY"
          echo "- build (cli): $((t1-t0))s" >> "$GITHUB_STEP_SUMMARY"
          ls -la target/release/larql

      - name: extract lightest model (SmolLM2-135M) -> vindex (TIMED)
        run: |
          export PATH="$PWD/larql-src/target/release:$PATH"
          V="$GITHUB_WORKSPACE/smol.vindex"
          echo "V=$V" >> "$GITHUB_ENV"
          t0=$(date +%s)
          larql extract hf://HuggingFaceTB/SmolLM2-135M-Instruct --output "$V" 2>&1 | tail -25
          t1=$(date +%s)
          echo "- extract SmolLM2-135M -> vindex: $((t1-t0))s ($(du -sh "$V" 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          echo '=== vindex dir ==='; ls -la "$V" | head
          echo '=== show (quant/level) ==='; larql show "$V" 2>&1 | head -15

      - name: larql run - DIRECT inference (TIMED, MUST pass)
        run: |
          export PATH="$PWD/larql-src/target/release:$PATH"
          t0=$(date +%s)
          out=$(larql run "$V" "Reply with exactly one word: OK" -n 8 2>/tmp/run.err) || rc=$?
          rc=${rc:-0}
          t1=$(date +%s)
          echo "=== rc=$rc time=$((t1-t0))s ==="
          echo "OUT: $out"
          echo "=== run.err (tail) ==="; tail -20 /tmp/run.err
          if [ "$rc" != "0" ]; then echo "- **larql run**: FAILED rc=$rc (see run.err)" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          v=NO-OK; echo "$out" | grep -qiE 'OK' && v=OK
          echo "- **larql run direct**: $((t1-t0))s -> \`$(echo "$out" | tr '\n' ' ' | head -c 60)\` [$v]" >> "$GITHUB_STEP_SUMMARY"
