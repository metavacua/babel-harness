# larql-as-an-ordinary-LM verification. Goal (scoped): a GitHub runner builds
# larql-cli + larql-server, serves a HuggingFace vindex, and answers the
# OpenAI-compat /v1 API — the exact contract bin/babel + goose consume, so babel
# can treat a vindex "like any other language model". Also drives bin/babel's
# larql backend end-to-end against the running server (best-effort — goose).
#
# Heavy (cold Rust build ~<20min). Runs on manual dispatch or when this file /
# bin/babel changes. Timeout under GitHub's 6h cap.
name: babel-larql-probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/babel-larql-probe.yml"
      - "bin/babel"

permissions:
  contents: read

jobs:
  larql-as-lm:
    name: build larql-server + serve vindex + /v1 + bin/babel
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - name: checkout larql source (public)
        uses: actions/checkout@v5
        with:
          repository: metavacua/larql-to-sparql
          path: larql-src

      - name: install build deps (OpenBLAS)
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config

      - name: build larql-cli + larql-server (cold, TIMED)
        working-directory: larql-src
        run: |
          t0=$(date +%s)
          cargo build --release -p larql-cli -p larql-server 2>&1 | tail -20
          t1=$(date +%s)
          echo "## larql-as-LM verify" >> "$GITHUB_STEP_SUMMARY"
          echo "- build (cli+server): $((t1-t0))s" >> "$GITHUB_STEP_SUMMARY"
          ls -la target/release/larql target/release/larql-server

      - name: pull vindex into cache (TIMED)
        run: |
          export PATH="$PWD/larql-src/target/release:$PATH"
          t0=$(date +%s)
          larql pull hf://chrishayuk/gemma-3-4b-it-vindex 2>&1 | tail -15
          t1=$(date +%s)
          echo "- pull: $((t1-t0))s" >> "$GITHUB_STEP_SUMMARY"
          larql list 2>&1 | tail -10 || true

      - name: serve + OpenAI-compat /v1 (the LM interface — MUST pass)
        run: |
          export PATH="$PWD/larql-src/target/release:$PATH"
          t0=$(date +%s)
          larql serve hf://chrishayuk/gemma-3-4b-it-vindex --port 8181 > /tmp/serve.log 2>&1 &
          ready=0
          for i in $(seq 1 240); do curl -fsS http://localhost:8181/v1/models >/dev/null 2>&1 && { ready=1; break; }; sleep 2; done
          t1=$(date +%s)
          echo "- serve ready: $((t1-t0))s (ready=$ready)" >> "$GITHUB_STEP_SUMMARY"
          [ "$ready" = "1" ] || { echo '=== serve.log ==='; tail -50 /tmp/serve.log; exit 1; }
          echo '=== /v1/models ==='; curl -fsS http://localhost:8181/v1/models | tee /tmp/models.json; echo
          mid=$(python3 -c "import json;print(json.load(open('/tmp/models.json'))['data'][0]['id'])")
          echo "=== /v1/chat/completions (model=$mid) ==="
          resp=$(curl -fsS http://localhost:8181/v1/chat/completions -H 'content-type: application/json' \
                 -d "{\"model\":\"$mid\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly one word: OK\"}],\"max_tokens\":8,\"temperature\":0}")
          echo "$resp" | tee /tmp/resp.json
          content=$(echo "$resp" | python3 -c 'import json,sys;print(json.load(sys.stdin)["choices"][0]["message"]["content"])' 2>/dev/null || echo "$resp" | head -c 100)
          echo "- **/v1 completion**: \`$content\` (model \`$mid\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: drive bin/babel --backend larql against the running server (best-effort)
        continue-on-error: true
        run: |
          set -x
          curl -fsSL https://raw.githubusercontent.com/block/goose/main/download_cli.sh -o /tmp/gi.sh 2>/dev/null && CONFIGURE=false bash /tmp/gi.sh || echo "goose install returned nonzero"
          export PATH="$HOME/.local/bin:$PWD/larql-src/target/release:$PATH"
          goose --version || { echo "goose unavailable — babel's larql backend routes through goose; recording as gap"; exit 1; }
          out=$(LARQL_PORT=8181 LARQL_BIN="$PWD/larql-src/target/release/larql" LARQL_NO_CGROUP=1 GOOSE_BIN=goose \
                bash bin/babel --backend larql --vindex gemma-3-4b-it-vindex "Reply with exactly one word: OK" 2>&1)
          echo "$out"
          echo "- **bin/babel --backend larql**: $(echo "$out" | grep -o '{\"type\":\"babel_result\".*}' | head -1)" >> "$GITHUB_STEP_SUMMARY"
